AWSTemplateFormatVersion: '2010-09-09'
Description: Neverland GPS v1 non-PII prototype control/evidence plane
Parameters:
  Environment:
    Type: String
    Default: prototype
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: System
          Value: NeverlandGPS
        - Key: DataClass
          Value: NoChildPII
  DeviceManifestTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: version
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: System
          Value: NeverlandGPS
        - Key: DataClass
          Value: NoChildPII
  ReceiptTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: receipt_id
          AttributeType: S
      KeySchema:
        - AttributeName: receipt_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: System
          Value: NeverlandGPS
        - Key: DataClass
          Value: NoChildPII
  ProofDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  ProofQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProofDLQ.Arn
        maxReceiveCount: 3
Outputs:
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  DeviceManifestTable:
    Value: !Ref DeviceManifestTable
  ReceiptTable:
    Value: !Ref ReceiptTable
  ProofQueue:
    Value: !Ref ProofQueue
