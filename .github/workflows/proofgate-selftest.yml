name: ProofGate self-test

on:
  workflow_dispatch:
  push:
    paths:
      - "proofgate_ai/**"
      - "pyproject.toml"
      - ".github/actions/proofgate/**"
      - ".github/workflows/proofgate-selftest.yml"

permissions:
  contents: read

jobs:
  frozen-local-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile client
        run: python -m py_compile proofgate_ai/*.py
      - name: Run frozen adversarial matrix locally
        run: |
          python -m pip install --disable-pip-version-check . rfc8785==0.1.4
          SCQOS_TEST_MODE=1 PYTHONPATH=.:challenge/public_execution_challenge \
            python challenge/public_execution_challenge/test_runtime.py
