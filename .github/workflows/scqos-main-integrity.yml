name: SCQOS main integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fail on forbidden secret artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .scqos-universal-secret
          if find . -type f \( -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.env' -o -name '.env.*' -o -iname '*private*key*.pem' \) -print -quit | grep -q .; then
            echo "Forbidden secret-like artifact found in repository"
            exit 1
          fi
      - name: Compile ProofGate client
        run: python -m py_compile proofgate_ai/*.py
      - name: Run ProofGate frozen adversarial matrix
        run: |
          python -m pip install --disable-pip-version-check .
          proofgate matrix
