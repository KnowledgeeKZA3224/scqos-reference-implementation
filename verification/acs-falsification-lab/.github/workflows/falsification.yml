name: falsification-lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m scqos_acs_lab.harness --direct-local --output run-evidence/ci-local.json
      - uses: actions/upload-artifact@v4
        with:
          name: falsification-evidence
          path: run-evidence/
